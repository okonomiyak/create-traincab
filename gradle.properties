# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
# Gradle does not run on the system-default Java (25 here); pin the Gradle JVM to JDK 21.
org.gradle.java.home=C:/Program Files/Java/jdk-21.0.10
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# Pinned to the same NeoForge version Create 6.0.11 for 1.21.1 was built against.
neo_version=21.1.219
neo_version_range=[21.1.0,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Create (hard dependency)
# https://maven.createmod.net/com/simibubi/create/create-1.21.1/
create_version=6.0.11-295
create_version_range=[6.0.0,)

## Mod Properties
mod_id=traincab
mod_name=Train Cab HUD
mod_license=GPL-3.0-only
mod_version=0.1.0
mod_group_id=uk.iwaservice
mod_authors=
mod_description=Cab HUD and driving simulation for Create trains: a stepped master controller (P5..N..B7/EB) with reverser, station stop assist with stop-position grading, conductor duty with real door control, signal bell and on-board announcements, an advanced cab with a brake cylinder pressure gauge, and a horn and music horn.
