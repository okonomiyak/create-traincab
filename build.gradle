plugins {
    id 'idea'
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    // Create's own artifacts and its Flywheel/Ponder transitive dependencies
    maven { url = 'https://maven.createmod.net' }
    // Registrate, a transitive compile-time dependency of Create (embedded via jar-in-jar at runtime,
    // but still needed on the compile classpath since Create declares it as an `api` dependency)
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Hard, compile+runtime dependency on Create. Declaring it here (rather than compileOnly)
    // matches the "required" dependency declared in neoforge.mods.toml: NeoForge will refuse to
    // load this mod at all when Create is missing, instead of throwing a raw NoClassDefFoundError.
    implementation "com.simibubi.create:create-${minecraft_version}:${create_version}"

    // MP3 decoder for uploaded departure bell sounds (LGPL-2.1), shipped inside our jar.
    jarJar(implementation("javazoom:jlayer:1.0.1"))
    additionalRuntimeClasspath "javazoom:jlayer:1.0.1"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            create_version_range   : create_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
