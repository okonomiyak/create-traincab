name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties pins org.gradle.java.home to a local Windows JDK; use the runner's instead.
      - run: ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME"

      - uses: actions/upload-artifact@v4
        with:
          name: traincab-${{ github.ref_name }}-${{ github.sha }}
          path: build/libs/*.jar
